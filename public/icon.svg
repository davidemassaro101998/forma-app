<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (verde smeraldo-teal) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA968" />
      <stop offset="100%" stop-color="#0B8452" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#053A26" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS Style Rounded App Icon Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Manubrio stilizzato -->
  <g filter="url(#shadow)" stroke="#FFFFFF" stroke-linecap="round" stroke-width="30" fill="none">
    <line x1="150" y1="256" x2="362" y2="256" />
    <rect x="120" y="196" width="60" height="120" rx="20" fill="#FFFFFF" stroke="none" />
    <rect x="332" y="196" width="60" height="120" rx="20" fill="#FFFFFF" stroke="none" />
    <rect x="70" y="216" width="34" height="80" rx="12" fill="#FFFFFF" stroke="none" />
    <rect x="408" y="216" width="34" height="80" rx="12" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
